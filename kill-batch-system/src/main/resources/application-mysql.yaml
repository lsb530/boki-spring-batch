spring:
  datasource:
    url: jdbc:mysql://localhost:3306/example_batch?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  batch:
    jdbc:
      initialize-schema: always

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data-mysql.sql

logging:
  level:
    root: info
    com.boki.batch.killbatchsystem: debug
    org.springframework.boot.autoconfigure.sql.init: debug
    org.springframework.jdbc.datasource.init.ScriptUtils: debug